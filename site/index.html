<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finance-tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">

    <header class="hero">
      <h1>finance-tracker</h1>
      <p id="engine-status">Loading calculation engine…</p>
      <p id="current-balance"></p>
      <select id="account-selector"></select>
    </header>

    <div class="card">
      <h2>AI Settings</h2>
      <p id="ai-status"></p>
      <div class="form-field">
        <label for="ai-api-key-input">Groq API Key</label>
        <div class="key-input-row">
          <input type="password" id="ai-api-key-input" placeholder="Enter your Groq API key">
          <button type="button" id="toggle-key-visibility" class="btn-secondary">Show</button>
        </div>
      </div>
      <p id="ai-key-error"></p>
      <button type="button" id="save-ai-key-btn" class="btn-primary">Save Key</button>
      <button type="button" id="remove-ai-key-btn" class="btn-secondary" style="display: none;">Remove Key</button>
    </div>

    <hr class="horizon-line">

    <div id="projection-tool" class="card">
      <h2>Project Future Balance</h2>
      <div class="projection-controls">
        <div class="form-field">
          <label for="projection-date">As of date</label>
          <input type="date" id="projection-date">
        </div>
        <div class="btn-group">
          <button type="button" id="calculate-projection-btn" class="btn-secondary">Calculate</button>
          <button type="button" id="show-chart-btn" class="btn-secondary">Show Chart</button>
        </div>
      </div>
      <p id="projected-balance-display"></p>
      <canvas id="balance-chart"></canvas>
    </div>

    <div class="card">
      <h2>Accounts</h2>
      <div id="account-list"></div>
      <form id="account-form">
        <div class="form-field">
          <label for="account-name">Name</label>
          <input type="text" id="account-name" required>
        </div>
        <div class="form-field">
          <label for="account-starting-balance">Starting Balance</label>
          <input type="number" id="account-starting-balance" step="0.01" value="0" required>
        </div>
        <button type="submit" class="btn-primary">Add Account</button>
      </form>
    </div>

    <div class="card">
      <h2>Transfers</h2>
      <div id="transfer-list"></div>
      <form id="transfer-form">
        <div class="form-field">
          <label for="from-account">From Account</label>
          <select id="from-account" required></select>
        </div>
        <div class="form-field">
          <label for="to-account">To Account</label>
          <select id="to-account" required></select>
        </div>
        <div class="form-field">
          <label for="transfer-amount">Amount</label>
          <input type="number" id="transfer-amount" min="0" step="0.01" required>
        </div>
        <div class="form-field">
          <label for="transfer-date">Date</label>
          <input type="date" id="transfer-date" required>
        </div>
        <p id="transfer-form-error"></p>
        <button type="submit" class="btn-primary">Add Transfer</button>
        <button type="button" id="cancel-transfer-edit-btn" style="display: none;">Cancel</button>
      </form>
    </div>

    <div class="card">
      <h2>Recurring Suggestions</h2>
      <button type="button" id="check-recurring-btn" class="btn-secondary"
        disabled>Check for Recurring Charges</button>
      <div id="recurring-suggestions-list"></div>
    </div>

    <div class="card">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-field">
          <label for="label">Label</label>
          <input type="text" id="label" name="label" required>
        </div>

        <div class="form-field">
          <label for="category">Category</label>
          <input type="text" id="category" name="category" required>
        </div>

        <div class="form-field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" min="0" step="0.01" required>
        </div>

        <div class="form-field">
          <label for="direction">Direction</label>
          <select id="direction" name="direction">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-field">
          <label for="frequency">Frequency</label>
          <select id="frequency" name="frequency">
            <option value="none">None</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>

        <div class="form-field">
          <label for="tx-account">Account</label>
          <select id="tx-account" required></select>
        </div>

        <button type="submit" class="btn-primary">Add Transaction</button>
        <button type="button" id="cancel-edit-btn" style="display: none;">Cancel</button>
      </form>
    </div>

    <div class="card">
      <h2>Transactions</h2>
      <div id="transaction-list"></div>
    </div>

  </div>

  <div id="remove-key-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <p>Remove your saved API key? AI-assisted recurring detection will
        be disabled until you add a new key.</p>
      <div class="modal-actions">
        <button type="button" id="cancel-remove-key-btn" class="btn-secondary">Cancel</button>
        <button type="button" id="confirm-remove-key-btn" class="btn-delete-confirm">Remove Key</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
